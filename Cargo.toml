[package]
edition = "2021"
name = "agsolutions_printers"
version = "0.0.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
# napi6 = N-API v6 (BigInt, Date); chrono_date = DateTime<Utc> ↔ JS Date mapping
# https://nodejs.org/api/n-api.html#node-api-version-matrix
napi = { version = "3.8.6", default-features = false, features = ["napi6", "chrono_date"] }
napi-derive = "3.5.5"
chrono = { version = "0.4", default-features = false, features = ["std"] }
printers = "2.3.0"

[build-dependencies]
napi-build = "2.3.1"

[profile.release]
lto = true
strip = "symbols"
